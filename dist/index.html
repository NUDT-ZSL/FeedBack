<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>线索笔记 · 本地知识关联工具</title>
  <style>
:root {
  color-scheme: light;
  --bg: #f5f2eb;
  --panel: #fffdf8;
  --ink: #24211d;
  --muted: #756f65;
  --line: #e5ddce;
  --accent: #9d5c2f;
  --accent-soft: #f3e5d8;
  --green: #31684d;
  --green-soft: #e2efe7;
  --red: #9b3d3d;
  --red-soft: #f7e5e3;
  --shadow: 0 14px 38px rgba(70, 55, 34, 0.09);
  font-family: "Inter", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background:
    radial-gradient(circle at 12% 0%, rgba(157, 92, 47, 0.12), transparent 34%),
    linear-gradient(135deg, #f8f5ee, var(--bg));
  color: var(--ink);
}

button, input, textarea { font: inherit; }
button { cursor: pointer; }

.app-shell {
  width: min(1540px, 100%);
  margin: 0 auto;
  padding: 30px;
}

.app-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 22px;
}

.eyebrow, .section-kicker {
  margin: 0 0 5px;
  color: var(--accent);
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
}

h1, h2, h3, p { margin-top: 0; }
h1 { margin-bottom: 6px; font-size: clamp(28px, 4vw, 42px); letter-spacing: -0.04em; }
h2 { margin-bottom: 0; font-size: 18px; }
.subtitle { margin-bottom: 0; color: var(--muted); }

.layout {
  display: grid;
  grid-template-columns: minmax(250px, 0.8fr) minmax(410px, 1.25fr) minmax(320px, 1fr);
  gap: 18px;
  align-items: start;
}

.panel {
  background: rgba(255, 253, 248, 0.92);
  border: 1px solid var(--line);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 18px;
}

.list-panel, .related-panel { position: sticky; top: 18px; max-height: calc(100vh - 36px); overflow: auto; }
.panel-title, .editor-heading {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 15px;
}

.count {
  min-width: 26px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  text-align: center;
  font-size: 12px;
  font-weight: 800;
}

.search-row { margin-bottom: 12px; }
input, textarea {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: #fff;
  color: var(--ink);
  padding: 11px 12px;
  outline: none;
  transition: border-color 0.15s, box-shadow 0.15s;
}
textarea { resize: vertical; line-height: 1.65; }
input:focus, textarea:focus {
  border-color: rgba(157, 92, 47, 0.65);
  box-shadow: 0 0 0 3px rgba(157, 92, 47, 0.12);
}

.primary, .ghost {
  border: 0;
  border-radius: 12px;
  padding: 10px 15px;
  font-weight: 750;
  white-space: nowrap;
}
.primary { background: var(--accent); color: white; box-shadow: 0 8px 18px rgba(157, 92, 47, 0.22); }
.primary:hover { background: #874e27; }
.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
.ghost:hover { background: #f6f0e7; }
.danger { color: var(--red); }
.danger:hover { background: var(--red-soft); border-color: rgba(155, 61, 61, 0.3); }

.note-list { display: flex; flex-direction: column; gap: 9px; }
.note-item {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: #fff;
  padding: 13px;
  text-align: left;
}
.note-item:hover { border-color: rgba(157, 92, 47, 0.42); background: #fffaf4; }
.note-item.active {
  border-color: var(--accent);
  box-shadow: inset 4px 0 0 var(--accent);
  background: #fff8f1;
}
.note-item h3 { margin: 0 0 7px; font-size: 15px; }
.note-item p { margin: 8px 0 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
.meta-line { display: flex; flex-wrap: wrap; gap: 5px; }
.tag-chip, .reason-chip {
  display: inline-flex;
  align-items: center;
  border-radius: 999px;
  padding: 3px 8px;
  font-size: 12px;
  line-height: 1.35;
}
.tag-chip { background: var(--accent-soft); color: #713f1d; }
.reason-chip.tag { background: var(--green-soft); color: var(--green); font-weight: 700; }
.reason-chip.text { background: #e8eef7; color: #385374; }

.empty-state, .island-state {
  border: 1px dashed var(--line);
  border-radius: 16px;
  padding: 18px;
  color: var(--muted);
  background: rgba(255,255,255,0.55);
  line-height: 1.6;
}
.island-state {
  border-color: rgba(155, 61, 61, 0.35);
  background: var(--red-soft);
  color: #713232;
  font-weight: 700;
}
.island-state strong { display: block; margin-bottom: 5px; font-size: 16px; }

.field { display: block; margin-bottom: 16px; }
.field > span {
  display: block;
  margin-bottom: 7px;
  font-size: 13px;
  font-weight: 750;
  color: #4e483f;
}
.save-status { min-height: 20px; margin: 8px 0 0; color: var(--green); font-size: 13px; }

.trail {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 14px;
  padding-bottom: 13px;
  border-bottom: 1px solid var(--line);
  overflow-x: auto;
}
.trail button {
  border: 1px solid var(--line);
  border-radius: 999px;
  background: #fff;
  padding: 5px 10px;
  color: var(--muted);
  font-size: 12px;
  white-space: nowrap;
}
.trail button.current { background: var(--accent); border-color: var(--accent); color: #fff; }
.trail-sep { color: var(--muted); font-size: 12px; }

.related-list { display: flex; flex-direction: column; gap: 12px; }
.related-card {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #fff;
  padding: 14px;
  text-align: left;
}
.related-card:hover { border-color: rgba(49, 104, 77, 0.5); box-shadow: 0 10px 24px rgba(49,104,77,0.08); }
.related-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 12px;
  margin-bottom: 9px;
}
.related-top h3 { margin: 0; font-size: 16px; }
.score {
  flex: 0 0 auto;
  border-radius: 999px;
  background: var(--green-soft);
  color: var(--green);
  padding: 4px 9px;
  font-size: 12px;
  font-weight: 800;
}
.reason-block { display: flex; flex-direction: column; gap: 8px; }
.reason-line { display: flex; gap: 7px; align-items: flex-start; font-size: 13px; line-height: 1.55; }
.reason-label {
  flex: 0 0 auto;
  min-width: 46px;
  color: var(--accent);
  font-weight: 800;
}
.clue-wrap { display: flex; flex-wrap: wrap; gap: 5px; }
.snippet {
  margin: 8px 0 0;
  border-left: 3px solid var(--line);
  padding: 2px 0 2px 9px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.5;
}

@media (max-width: 1080px) {
  .layout { grid-template-columns: 1fr 1.35fr; }
  .related-panel { grid-column: 1 / -1; position: static; max-height: none; }
}
@media (max-width: 720px) {
  .app-shell { padding: 18px; }
  .app-header, .editor-heading { align-items: flex-start; flex-direction: column; }
  .layout { grid-template-columns: 1fr; }
  .list-panel { position: static; max-height: 420px; }
}

  </style>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">LOCAL KNOWLEDGE MAP</p>
        <h1>线索笔记</h1>
        <p class="subtitle">从一条笔记出发，沿共同标签与文本线索回看真正相关的内容。</p>
      </div>
      <button id="newNoteBtn" class="primary" type="button">＋ 新建笔记</button>
    </header>

    <main class="layout">
      <aside class="panel list-panel" aria-label="笔记列表">
        <div class="panel-title">
          <h2>笔记</h2>
          <span id="noteCount" class="count">0</span>
        </div>
        <div class="search-row">
          <input id="searchInput" type="search" placeholder="搜索标题、标签或正文" aria-label="搜索笔记">
        </div>
        <div id="noteList" class="note-list"></div>
      </aside>

      <section class="panel editor-panel">
        <div class="editor-heading">
          <div>
            <p class="section-kicker">当前笔记</p>
            <h2 id="editorTitleLabel">未选择笔记</h2>
          </div>
          <div class="editor-actions">
            <button id="deleteBtn" class="ghost danger" type="button" hidden>删除</button>
            <button id="saveBtn" class="primary" type="button">保存新笔记</button>
          </div>
        </div>

        <form id="noteForm">
          <label class="field">
            <span>标题</span>
            <input id="titleInput" maxlength="120" placeholder="例如：项目复盘会的关键决定" autocomplete="off">
          </label>
          <label class="field">
            <span>标签（用逗号、空格或顿号分隔）</span>
            <input id="tagsInput" placeholder="例如：项目管理, 复盘, 效率" autocomplete="off">
          </label>
          <label class="field">
            <span>自由文本</span>
            <textarea id="bodyInput" rows="11" placeholder="写下想法、摘录、问题或待办……"></textarea>
          </label>
          <p id="saveStatus" class="save-status" role="status" aria-live="polite"></p>
        </form>
      </section>

      <aside class="panel related-panel" aria-label="关联笔记">
        <nav id="trailNav" class="trail" aria-label="浏览线索"></nav>
        <div class="panel-title">
          <h2>相关笔记</h2>
        </div>
        <div id="relatedList" class="related-list"></div>
      </aside>
    </main>
  </div>

  <script>
// 纯数据规则模块：不访问 DOM，也不缓存关联结果。
// 每次调用 findRelated 都基于当前笔记重新计算，避免编辑后残留旧判断。

const TAG_DELIMITER = /[,，;；、\s]+/;

const CJK_RANGE = /[㐀-鿿]+/g;
const WORD_RANGE = /[a-z0-9]+(?:[._-][a-z0-9]+)*/g;
const CJK_STOP_CHARS = new Set(
  "的了和与是在我有及或这那你他它们吧呢吗呀把被让向对于之中上下也都很就还要会能可而但则之其以".split("")
);
const STOP_PHRASES = new Set([
  "一个", "这个", "那个", "什么", "怎么", "如何", "可以", "可能", "应该",
  "需要", "因为", "所以", "但是", "如果", "然后", "现在", "之前", "之后",
  "里面", "东西", "事情", "没有", "不是", "就是", "还是", "以及", "对于",
  "关于", "通过", "进行", "相关", "关联", "笔记", "内容", "记录", "一下",
  "一些", "很多", "比较", "非常", "觉得", "认为", "知道", "看到", "时候",
  "地方", "问题", "方法", "工作", "个人", "系统", "用户",
  "个事情", "个问题", "个地方", "个东西", "个方法", "个工作"
]);
const STOP_WORDS = new Set([
  "the", "a", "an", "and", "or", "but", "of", "to", "in", "on", "for",
  "with", "is", "are", "was", "were", "be", "been", "as", "at", "by",
  "from", "this", "that", "these", "those", "it", "its", "my", "our",
  "we", "you", "i", "note", "notes"
]);

function normalizeText(value = "") {
  return value.normalize("NFKC").replace(/\s+/g, " ").trim();
}

function parseTags(value = "") {
  const seen = new Set();
  const result = [];
  for (const raw of normalizeText(value).split(TAG_DELIMITER)) {
    const tag = normalizeText(raw);
    if (tag && !seen.has(tag.toLowerCase())) {
      seen.add(tag.toLowerCase());
      result.push(tag);
    }
  }
  return result;
}

function getRuns(text, field) {
  const normalized = normalizeText(text).toLowerCase();
  return [...normalized.matchAll(CJK_RANGE)]
    .map((match) => ({ value: match[0], start: match.index, field }));
}

function getLatinTerms(title, body) {
  const terms = new Map();
  for (const field of ["title", "body"]) {
    const normalized = normalizeText(field === "title" ? title : body).toLowerCase();
    for (const match of normalized.matchAll(WORD_RANGE)) {
      const value = match[0];
      if (STOP_WORDS.has(value) || (value.length === 1 && !/\d/.test(value))) continue;
      const existing = terms.get(value);
      const type = /^\d+$/.test(value) ? "number" : "word";
      if (existing) existing.inTitle ||= field === "title";
      else terms.set(value, { value, type, inTitle: field === "title" });
    }
  }
  return terms;
}

function analyzeNote(note) {
  return {
    note,
    tags: new Map(note.tags.map((tag) => [tag.toLowerCase(), tag])),
    latin: getLatinTerms(note.title, note.body),
    runs: [...getRuns(note.title, "title"), ...getRuns(note.body, "body")]
  };
}

function buildIndex(notes) {
  const analyzed = notes.map(analyzeNote);
  const latinFrequency = new Map();
  const bigramFrequency = new Map();

  for (const item of analyzed) {
    for (const value of item.latin.keys()) {
      latinFrequency.set(value, (latinFrequency.get(value) ?? 0) + 1);
    }
    const bigrams = new Set();
    for (const run of item.runs) {
      for (let index = 0; index < run.value.length - 1; index += 1) {
        bigrams.add(run.value.slice(index, index + 2));
      }
    }
    for (const bigram of bigrams) {
      bigramFrequency.set(bigram, (bigramFrequency.get(bigram) ?? 0) + 1);
    }
  }
  return { analyzed, latinFrequency, bigramFrequency };
}

function commonLength(a, b, startA, startB) {
  let length = 0;
  while (startA + length < a.length && startB + length < b.length &&
    a[startA + length] === b[startB + length]) {
    length += 1;
  }
  return length;
}

function intervalFree(used, start, length) {
  for (let index = start; index < start + length; index += 1) {
    if (used.has(index)) return false;
  }
  return true;
}

function markInterval(used, start, length) {
  for (let index = start; index < start + length; index += 1) used.add(index);
}

function validPhrase(phrase) {
  if (phrase.length < 2 || STOP_PHRASES.has(phrase)) return false;
  return ![...phrase].some((char) => CJK_STOP_CHARS.has(char));
}

function meaningfulSegments(phrase, start) {
  const segments = [];
  const isStop = (char) => CJK_STOP_CHARS.has(char);
  let segmentStart = 0;

  for (let index = 0; index <= phrase.length; index += 1) {
    if (index === phrase.length || isStop(phrase[index])) {
      const value = phrase.slice(segmentStart, index);
      if (value.length >= 2 && !STOP_PHRASES.has(value)) {
        segments.push({ value, sourceStart: start + segmentStart, length: value.length });
      }
      segmentStart = index + 1;
    }
  }
  return segments;
}

function commonPhraseClues(source, target, bigramFrequency, total) {
  const candidates = new Map();

  for (const sourceRun of source.runs) {
    for (const targetRun of target.runs) {
      for (let startA = 0; startA < sourceRun.value.length - 1; startA += 1) {
        for (let startB = 0; startB < targetRun.value.length - 1; startB += 1) {
          const length = commonLength(sourceRun.value, targetRun.value, startA, startB);
          if (length < 2) continue;
          const value = sourceRun.value.slice(startA, startA + length);
          const inTitle = sourceRun.field === "title" || targetRun.field === "title";
          const previous = candidates.get(value);
          if (!previous || (inTitle && !previous.inTitle)) {
            candidates.set(value, {
              value,
              length,
              inTitle,
              sourceStart: sourceRun.start + startA,
              sourceField: sourceRun.field
            });
          }
        }
      }
    }
  }

  const ordered = [...candidates.values()]
    .sort((a, b) => b.length - a.length ||
      a.value.localeCompare(b.value, "zh-Hans-CN"));
  const usedByField = { title: new Set(), body: new Set() };
  const clues = [];

  for (const candidate of ordered) {
    const used = usedByField[candidate.sourceField];
    if (!intervalFree(used, candidate.sourceStart, candidate.length)) continue;
    const segments = validPhrase(candidate.value)
      ? [{ value: candidate.value, sourceStart: candidate.sourceStart, length: candidate.length }]
      : meaningfulSegments(candidate.value, candidate.sourceStart);

    for (const segment of segments) {
      if (!intervalFree(used, segment.sourceStart, segment.length)) continue;
      markInterval(used, segment.sourceStart, segment.length);

      let rarestFrequency = total;
      for (let index = 0; index < segment.length - 1; index += 1) {
        const bigram = segment.value.slice(index, index + 2);
        rarestFrequency = Math.min(rarestFrequency, bigramFrequency.get(bigram) ?? 1);
      }
      const idf = Math.log((total + 1) / (rarestFrequency + 0.5)) + 1;
      const base = 3.1 + Math.min(segment.length, 5) * 0.8;
      const score = base * idf * (candidate.inTitle ? 1.35 : 1);
      clues.push({
        kind: "text",
        value: segment.value,
        type: segment.length >= 3 ? "cjk3" : "cjk2",
        inTitle: candidate.inTitle,
        score: Number(score.toFixed(3))
      });
    }
  }
  return clues;
}

function latinClues(source, target, latinFrequency, total) {
  const clues = [];
  for (const [value, term] of source.latin) {
    const other = target.latin.get(value);
    if (!other) continue;
    const frequency = latinFrequency.get(value) ?? 1;
    const idf = Math.log((total + 1) / (frequency + 0.5)) + 1;
    const base = term.type === "number" ? 1.4 : 2.75 + Math.min(value.length, 8) * 0.08;
    clues.push({
      kind: "text",
      value,
      type: term.type,
      inTitle: term.inTitle || other.inTitle,
      score: Number((base * idf * (term.inTitle || other.inTitle ? 1.35 : 1)).toFixed(3))
    });
  }
  return clues;
}

function isMeaningful(tagClues, textClues) {
  if (tagClues.length > 0) return true;
  if (textClues.some((clue) => clue.score >= 5.5)) return true;
  const supportive = textClues.filter((clue) => clue.score >= 4.2);
  return supportive.length >= 2;
}

const compareClues = (a, b) => b.score - a.score ||
  a.value.localeCompare(b.value, "zh-Hans-CN");

function findRelated(notes = [], selectedId) {
  const current = notes.find((note) => note.id === selectedId);
  if (!current) return [];
  const { analyzed, latinFrequency, bigramFrequency } = buildIndex(notes);
  const source = analyzed.find((item) => item.note.id === selectedId);

  return analyzed
    .filter((item) => item.note.id !== selectedId)
    .map((target) => {
      const tagClues = [];
      for (const [key, tag] of source.tags) {
        if (target.tags.has(key)) tagClues.push({ kind: "tag", value: tag, score: 12 });
      }

      const textClues = [
        ...commonPhraseClues(source, target, bigramFrequency, notes.length),
        ...latinClues(source, target, latinFrequency, notes.length)
      ].sort(compareClues).slice(0, 8);

      tagClues.sort(compareClues);
      const score = Number(
        [...tagClues, ...textClues].reduce((sum, clue) => sum + clue.score, 0).toFixed(3)
      );
      return {
        id: target.note.id,
        note: target.note,
        score,
        tagClues,
        textClues,
        connected: isMeaningful(tagClues, textClues)
      };
    })
    .filter((result) => result.connected)
    .sort((a, b) => b.score - a.score || b.note.updatedAt - a.note.updatedAt ||
      a.note.title.localeCompare(b.note.title, "zh-Hans-CN"));
}


const STORAGE_KEY = "clue-notes:v1";

const elements = {
  newNoteBtn: document.querySelector("#newNoteBtn"),
  noteCount: document.querySelector("#noteCount"),
  searchInput: document.querySelector("#searchInput"),
  noteList: document.querySelector("#noteList"),
  trailNav: document.querySelector("#trailNav"),
  relatedList: document.querySelector("#relatedList"),
  deleteBtn: document.querySelector("#deleteBtn"),
  saveBtn: document.querySelector("#saveBtn"),
  form: document.querySelector("#noteForm"),
  titleInput: document.querySelector("#titleInput"),
  tagsInput: document.querySelector("#tagsInput"),
  bodyInput: document.querySelector("#bodyInput"),
  editorTitleLabel: document.querySelector("#editorTitleLabel"),
  saveStatus: document.querySelector("#saveStatus")
};

let state = loadState();
let selectedId = state.notes[0]?.id ?? null;
let trail = selectedId ? [selectedId] : [];
let saveTimer = 0;
let draftId = null;

function createId() {
  if (crypto.randomUUID) return crypto.randomUUID();
  return `note-${Date.now()}-${Math.random().toString(16).slice(2)}`;
}

function loadState() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) ?? `{"notes":[]}`);
    return Array.isArray(saved.notes) ? saved : { notes: [] };
  } catch {
    return { notes: [] };
  }
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function escapeHtml(value) {
  return normalizeText(String(value ?? ""))
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function selectedNote() {
  return state.notes.find((note) => note.id === selectedId) ?? null;
}

function displayTitle(note) {
  return normalizeText(note.title) || "未命名笔记";
}

function preview(text, length = 92) {
  const clean = normalizeText(text);
  return clean.length > length ? `${clean.slice(0, length)}…` : clean;
}

function startNewNote() {
  window.clearTimeout(saveTimer);
  draftId = null;
  const now = Date.now();
  const note = { id: createId(), title: "", tags: [], body: "", createdAt: now, updatedAt: now };
  state.notes = [note, ...state.notes];
  selectedId = note.id;
  trail = [note.id];
  persist();
  render();
  elements.titleInput.focus();
}

function selectNote(id, options = {}) {
  if (!state.notes.some((note) => note.id === id)) return;
  window.clearTimeout(saveTimer);
  draftId = null;
  selectedId = id;
  if (options.fromRelated) {
    const existing = trail.indexOf(id);
    if (existing >= 0) trail = trail.slice(0, existing + 1);
    else trail.push(id);
  } else if (options.trailIndex !== undefined) {
    trail = trail.slice(0, options.trailIndex + 1);
  } else {
    trail = [id];
  }
  render();
}

function collectFormInto(note) {
  note.title = normalizeText(elements.titleInput.value);
  note.tags = parseTags(elements.tagsInput.value);
  note.body = normalizeText(elements.bodyInput.value);
  note.updatedAt = Date.now();
}

function flushDraft() {
  const note = selectedNote();
  if (!note || draftId !== note.id) return;
  collectFormInto(note);
  draftId = null;
  persist();
  render({ keepFocus: true });
}

function scheduleSave() {
  const note = selectedNote();
  if (!note) return;
  draftId = note.id;
  window.clearTimeout(saveTimer);
  elements.saveStatus.textContent = "正在更新关联…";
  saveTimer = window.setTimeout(() => {
    flushDraft();
    elements.saveStatus.textContent = "已保存，关联结果已按当前内容重新计算。";
  }, 350);
}

function deleteSelected() {
  const note = selectedNote();
  if (!note) return;
  window.clearTimeout(saveTimer);
  draftId = null;
  const removedTrailIndex = trail.indexOf(note.id);
  state.notes = state.notes.filter((item) => item.id !== note.id);
  if (removedTrailIndex > 0) {
    trail.splice(removedTrailIndex, 1);
    selectedId = trail[Math.min(removedTrailIndex, trail.length - 1)];
  } else {
    selectedId = state.notes[0]?.id ?? null;
    trail = selectedId ? [selectedId] : [];
  }
  persist();
  render();
}

function renderNoteList() {
  const query = elements.searchInput.value.trim().toLowerCase();
  const notes = [...state.notes]
    .sort((a, b) => b.updatedAt - a.updatedAt)
    .filter((note) => {
      if (!query) return true;
      return [note.title, note.body, note.tags.join(" ")].join("\n").toLowerCase().includes(query);
    });

  elements.noteCount.textContent = state.notes.length;
  if (state.notes.length === 0) {
    elements.noteList.innerHTML = `
      <div class="empty-state">
        还没有笔记。点击“新建笔记”会立刻把空白笔记加入列表，也可以
        <button type="button" data-action="sample" class="ghost">载入示例</button>。
      </div>`;
    return;
  }
  if (notes.length === 0) {
    elements.noteList.innerHTML = `<div class="empty-state">没有符合搜索条件的笔记。</div>`;
    return;
  }

  elements.noteList.innerHTML = notes.map((note) => {
    const tags = note.tags.slice(0, 4).map((tag) => `<span class="tag-chip">#${escapeHtml(tag)}</span>`).join("");
    return `
      <button type="button" class="note-item ${note.id === selectedId ? "active" : ""}" data-id="${note.id}">
        <h3>${escapeHtml(displayTitle(note))}</h3>
        <div class="meta-line">${tags || '<span class="tag-chip">无标签</span>'}</div>
        <p>${escapeHtml(preview(note.body)) || "暂无正文"}</p>
      </button>`;
  }).join("");
}

function syncEditor() {
  const note = selectedNote();
  elements.editorTitleLabel.textContent = note ? displayTitle(note) : "未选择笔记";
  elements.deleteBtn.hidden = !note;
  elements.saveBtn.textContent = note ? "立即保存并重算" : "保存新笔记";
  if (!note) {
    elements.form.reset();
    elements.saveStatus.textContent = "";
    return;
  }
  elements.titleInput.value = note.title;
  elements.tagsInput.value = note.tags.join(", ");
  elements.bodyInput.value = note.body;
}

function renderTrail() {
  if (!selectedId) {
    elements.trailNav.innerHTML = "";
    return;
  }
  elements.trailNav.innerHTML = trail.map((id, index) => {
    const note = state.notes.find((item) => item.id === id);
    if (!note) return "";
    return `
      <button type="button" class="${id === selectedId ? "current" : ""}" data-trail-index="${index}"
        title="退回到这条笔记">${escapeHtml(displayTitle(note))}</button>
      ${index < trail.length - 1 ? '<span class="trail-sep">→</span>' : ""}`;
  }).join("");
}

function strength(score) {
  if (score >= 30) return "很强";
  if (score >= 18) return "较强";
  if (score >= 10) return "中等";
  return "偏弱";
}

function makeSnippet(note, clue) {
  const value = clue.value;
  const inTitle = note.title.toLowerCase().includes(value.toLowerCase());
  const source = inTitle ? note.title : note.body;
  const index = source.toLowerCase().indexOf(value.toLowerCase());
  if (index < 0) return "";
  const start = Math.max(0, index - 18);
  const end = Math.min(source.length, index + value.length + 24);
  const excerpt = `${start > 0 ? "…" : ""}${source.slice(start, end)}${end < source.length ? "…" : ""}`;
  return `<p class="snippet">${inTitle ? "标题" : "正文"}：${escapeHtml(excerpt).replace(
    escapeHtml(value), `<mark>${escapeHtml(value)}</mark>`
  )}</p>`;
}

function makeTagSnippet(note, tagClue) {
  const tag = tagClue.value.toLowerCase();
  const inTitle = note.title.toLowerCase().includes(tag);
  const source = inTitle ? note.title : note.body;
  const index = source.toLowerCase().indexOf(tag);
  if (index < 0) {
    return `<p class="snippet">标签：${escapeHtml(tagClue.value)}</p>`;
  }
  const start = Math.max(0, index - 14);
  const end = Math.min(source.length, index + tag.length + 20);
  const excerpt = `${start > 0 ? "…" : ""}${source.slice(start, end)}${end < source.length ? "…" : ""}`;
  return `<p class="snippet">${inTitle ? "标题" : "正文"}：${escapeHtml(excerpt).replace(
    escapeHtml(tagClue.value), `<mark>${escapeHtml(tagClue.value)}</mark>`
  )}</p>`;
}

function renderRelated() {
  const note = selectedNote();
  if (!note) {
    elements.relatedList.innerHTML = `<div class="empty-state">选择或新建一条笔记后，这里会实时展示它的关联。</div>`;
    return;
  }

  const related = findRelated(state.notes, selectedId);
  if (related.length === 0) {
    elements.relatedList.innerHTML = `
      <div class="island-state">
        <strong>这条笔记当前是孤立的</strong>
        没有发现共同标签，也没有足够明确的共享文本线索。补充标签或在其他笔记中写入相同主题后，关联会自动出现。
      </div>`;
    return;
  }

  elements.relatedList.innerHTML = related.map((item) => {
    const tags = item.tagClues.slice(0, 5)
      .map((clue) => `<span class="reason-chip tag">共同标签 #${escapeHtml(clue.value)}</span>`)
      .join("");
    const texts = item.textClues.slice(0, 5)
      .map((clue) => `<span class="reason-chip text" title="线索分 ${clue.score}">“${escapeHtml(clue.value)}”${clue.inTitle ? " · 标题" : ""}</span>`)
      .join("");
    return `
      <button type="button" class="related-card" data-jump="${item.id}">
        <div class="related-top">
          <h3>${escapeHtml(displayTitle(item.note))}</h3>
          <span class="score">相关度：${strength(item.score)} · ${item.score.toFixed(1)}</span>
        </div>
        <div class="reason-block">
          ${tags ? `<div class="reason-line"><span class="reason-label">标签</span><span class="clue-wrap">${tags}</span></div>` : ""}
          ${texts ? `<div class="reason-line"><span class="reason-label">文本</span><span class="clue-wrap">${texts}</span></div>` : ""}
        </div>
        ${item.textClues[0]
          ? makeSnippet(item.note, item.textClues[0])
          : item.tagClues[0] ? makeTagSnippet(item.note, item.tagClues[0]) : ""}
      </button>`;
  }).join("");
}

function render(options = {}) {
  const active = document.activeElement?.id;
  const cursor = [elements.titleInput, elements.tagsInput, elements.bodyInput]
    .includes(document.activeElement)
    ? { start: document.activeElement.selectionStart, end: document.activeElement.selectionEnd }
    : null;

  renderNoteList();
  if (!options.keepFocus) syncEditor();
  renderTrail();
  renderRelated();

  if (options.keepFocus && active) {
    const field = document.querySelector(`#${active}`);
    if (field) {
      field.focus();
      if (cursor && Number.isInteger(cursor.start)) field.setSelectionRange(cursor.start, cursor.end);
    }
  }
}

function loadSampleNotes() {
  const now = Date.now();
  const samples = [
    {
      title: "项目复盘：个人知识工具的需求",
      tags: ["产品设计", "知识管理", "复盘"],
      body: "会议决定优先处理标签过滤、双向链接和关联理由。用户从一条笔记出发时，要能看到共同标签和正文里的具体线索，而不是只得到一个黑盒分数。"
    },
    {
      title: "关联结果为什么必须可解释",
      tags: ["产品设计", "知识管理"],
      body: "如果两条笔记因为共同标签或相同的关键短语而相关，界面应该直接说明原因。可解释的关联能帮助用户判断这条链接是否值得继续回看。"
    },
    {
      title: "本地优先笔记应用调研",
      tags: ["知识管理", "本地软件"],
      body: "本地数据和离线可用是基础。后续可以加入全文搜索、双向链接、标签重命名以及按关联链浏览历史笔记的功能。"
    },
    {
      title: "周末跑步记录",
      tags: ["健康", "跑步"],
      body: "今晚沿河边慢跑五公里，心率稳定。明天早上拉伸，周末再补充一次间歇训练。"
    }
  ];
  state.notes = samples.map((sample, index) => ({
    id: createId(),
    ...sample,
    createdAt: now - (samples.length - index) * 1000,
    updatedAt: now - (samples.length - index) * 1000
  }));
  selectedId = state.notes[0].id;
  trail = [selectedId];
  persist();
  render();
}

function commitPendingBeforeSwitch() {
  const note = selectedNote();
  if (note && draftId === note.id) {
    window.clearTimeout(saveTimer);
    flushDraft();
  }
  window.clearTimeout(saveTimer);
  draftId = null;
}

elements.newNoteBtn.addEventListener("click", () => {
  commitPendingBeforeSwitch();
  startNewNote();
});
elements.deleteBtn.addEventListener("click", () => {
  const note = selectedNote();
  if (note && window.confirm(`确定删除「${displayTitle(note)}」吗？此工具只保留当前浏览器中的本地数据。`)) {
    deleteSelected();
  }
});
elements.form.addEventListener("submit", (event) => {
  event.preventDefault();
  window.clearTimeout(saveTimer);
  flushDraft();
  elements.saveStatus.textContent = "已保存，关联结果已按当前内容重新计算。";
});
[elements.titleInput, elements.tagsInput, elements.bodyInput].forEach((field) => {
  field.addEventListener("input", scheduleSave);
});
elements.noteList.addEventListener("click", (event) => {
  const sampleButton = event.target.closest('[data-action="sample"]');
  if (sampleButton) {
    loadSampleNotes();
    return;
  }
  const item = event.target.closest("[data-id]");
  if (!item || item.dataset.id === selectedId) return;
  commitPendingBeforeSwitch();
  selectNote(item.dataset.id);
});
elements.relatedList.addEventListener("click", (event) => {
  const card = event.target.closest("[data-jump]");
  if (!card) return;
  commitPendingBeforeSwitch();
  selectNote(card.dataset.jump, { fromRelated: true });
});
elements.trailNav.addEventListener("click", (event) => {
  const button = event.target.closest("[data-trail-index]");
  if (!button) return;
  const index = Number(button.dataset.trailIndex);
  commitPendingBeforeSwitch();
  selectNote(trail[index], { trailIndex: index });
});
elements.searchInput.addEventListener("input", renderNoteList);
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") {
    window.clearTimeout(saveTimer);
    flushDraft();
  }
});

render();

</script>
</body>
</html>
