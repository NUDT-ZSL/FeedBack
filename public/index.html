<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清晰阅读 · 低视力排版工具</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="toolbar">
  <span class="brand">清晰阅读</span>
  <button id="btn-open">导入文档…</button>
  <button id="btn-sample">载入示例</button>
  <input type="file" id="file-input" accept=".txt,.md,.markdown,text/plain" hidden>
  <span class="sep"></span>
  <button id="btn-dec" title="缩小字号 (Ctrl+-)">A−</button>
  <input type="range" id="font-slider" min="16" max="96" step="2" value="30"
         aria-label="字号">
  <button id="btn-inc" title="放大字号 (Ctrl+=)">A＋</button>
  <span id="font-label">30px</span>
  <span class="sep"></span>
  <label for="width-select">视窗</label>
  <select id="width-select">
    <option value="100">100%</option>
    <option value="75">75%</option>
    <option value="55">55%</option>
    <option value="38">38%</option>
  </select>
  <button id="btn-theme">夜间模式</button>
</header>
<main id="stage-wrap">
  <div id="stage">
    <article id="article"></article>
  </div>
</main>
<footer id="statusbar">
  <span id="status-pos">尚未导入文档</span>
  <span id="status-layout"></span>
</footer>
<script src="lib.js"></script>
<script src="app.js"></script>
</body>
</html>
