<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>资金情景推演台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">本地运行 · 数据只保存在当前浏览器</p>
        <h1>资金情景推演台</h1>
      </div>
      <div class="top-actions">
        <button type="button" id="resetSample" class="btn secondary">载入示例</button>
        <button type="button" id="clearPlan" class="btn ghost">清空</button>
      </div>
    </header>

    <main class="layout">
      <section class="panel controls" aria-label="计划与情景参数">
        <form id="settingsForm" class="settings-grid">
          <label>期初余额<input id="openingBalance" type="number" step="0.01" inputmode="decimal"></label>
          <label>安全线<input id="safetyLine" type="number" step="0.01" inputmode="decimal"></label>
          <label>开始日期<input id="startDate" type="date"></label>
          <label>结束日期<input id="endDate" type="date"></label>
        </form>

        <div class="section-heading">
          <h2>基础收支计划</h2>
          <button type="button" class="btn small" id="addIncome">+ 收入</button>
          <button type="button" class="btn small danger-outline" id="addExpense">+ 支出</button>
        </div>
        <div class="table-wrap">
          <table id="entriesTable">
            <thead><tr><th>名称</th><th>类型</th><th>金额</th><th>起始日</th><th>结束日</th><th>规律</th><th></th></tr></thead>
            <tbody id="entriesBody"></tbody>
          </table>
        </div>

        <h2 class="scenario-title">叠加情景参数</h2>
        <p class="hint">收入延迟、支出提前、金额上浮会在同一次推演中一起生效；0 表示维持基准。</p>
        <div class="scenario-grid">
          <label>收入延迟（天）<input id="incomeDelayDays" type="number" min="0" step="1"></label>
          <label>支出提前（天）<input id="expenseAdvanceDays" type="number" min="0" step="1"></label>
          <label>支出金额上浮（%）<input id="expenseIncreasePct" type="number" min="0" step="0.1"></label>
        </div>
        <div id="validation" class="validation" role="alert"></div>
      </section>

      <section class="panel results" aria-label="推演结果">
        <div class="summary-cards">
          <article><span>期末余额</span><strong id="finalBalance">--</strong></article>
          <article><span>最大累计缺口</span><strong id="maxGap">--</strong></article>
          <article class="breach-card"><span>首次跌破安全线</span><strong id="breachDate">--</strong><small id="breachBalance"></small></article>
        </div>
        <div class="chart-toolbar">
          <div class="segmented" role="group" aria-label="图表指标">
            <button type="button" class="active" data-metric="balance">资金余额</button>
            <button type="button" data-metric="gap">累计缺口</button>
          </div>
          <div class="legend"><span><i class="line baseline"></i>基准</span><span><i class="line scenario"></i>情景</span><span><i class="line safety"></i>安全线</span></div>
        </div>
        <div id="chartWrap" class="chart-wrap">
          <svg id="chart" viewBox="0 0 920 390" role="img" aria-label="资金曲线"></svg>
          <div id="tooltip" class="tooltip" hidden></div>
        </div>
        <section class="breach-panel">
          <h2>缺口明细与触发原因</h2>
          <div id="breachSummary" class="breach-summary">当前参数下余额未跌破安全线。</div>
          <div id="factorPills" class="factor-pills"></div>
          <div class="table-wrap trace-wrap">
            <table>
              <thead><tr><th>收支项目</th><th>类型</th><th>基准日期</th><th>情景日期</th><th>基准金额</th><th>情景金额</th><th>对缺口影响</th><th>原因</th></tr></thead>
              <tbody id="traceBody"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>
  </div>
  <script src="src/engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
