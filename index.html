<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>记忆复习助手</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>记忆复习助手</h1>
  <div class="budget-box">
    <label for="budgetInput">今日时间预算</label>
    <input id="budgetInput" type="number" min="5" max="600" step="5">
    <span>分钟</span>
  </div>
  <nav class="tabs">
    <button class="tab active" data-view="today">今日复习</button>
    <button class="tab" data-view="items">知识点管理</button>
  </nav>
</header>

<main>
  <!-- 今日复习 -->
  <section id="view-today" class="view active">
    <div id="planSummary" class="plan-summary"></div>
    <div id="planList" class="card-list"></div>
    <h2 class="subhead" id="skippedHead" hidden>预算外待复习</h2>
    <div id="skippedList" class="card-list dim"></div>
  </section>

  <!-- 知识点管理 -->
  <section id="view-items" class="view">
    <form id="addForm" class="add-form">
      <input id="newName" type="text" placeholder="知识点名称，如：泰勒公式" required maxlength="60">
      <input id="newMinutes" type="number" min="1" max="120" value="5" title="预计复习耗时（分钟）">
      <button type="submit">添加知识点</button>
    </form>
    <div id="itemList" class="card-list"></div>
  </section>
</main>

<!-- 知识点详情弹窗 -->
<div id="detailModal" class="modal" hidden>
  <div class="modal-body">
    <button class="modal-close" id="detailClose">&times;</button>
    <h2 id="detailName"></h2>
    <div id="detailStats" class="stats"></div>
    <div class="adjust-box">
      <label>手动调整记忆强度（稳定度，天）：
        <span id="overrideVal"></span></label>
      <input id="overrideRange" type="range" min="0.3" max="120" step="0.1">
      <div class="adjust-actions">
        <button id="applyOverride" class="btn small">应用调整</button>
        <button id="clearOverride" class="btn small ghost">恢复自动推导</button>
      </div>
    </div>
    <h3>复习记录</h3>
    <div id="historyList" class="history"></div>
    <div class="danger-zone">
      <button id="deleteItem" class="btn danger">删除该知识点</button>
    </div>
  </div>
</div>

<footer class="foot">
  <button id="exportBtn" class="btn small ghost">导出数据</button>
  <button id="importBtn" class="btn small ghost">导入数据</button>
  <input id="importFile" type="file" accept="application/json" hidden>
  <span class="hint">数据保存在本机浏览器（localStorage），完全离线可用</span>
</footer>

<script src="js/model.js"></script>
<script src="js/plan.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
