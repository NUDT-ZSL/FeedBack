<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档评审工作台</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: "Microsoft YaHei", "PingFang SC", sans-serif; background: #f0f2f5; height: 100vh; display: flex; flex-direction: column; color: #1f2329; }
header { background: #1f2329; color: #fff; padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
header h1 { font-size: 16px; font-weight: 600; }
#summary { display: flex; align-items: center; gap: 10px; font-size: 13px; flex: 1; min-width: 260px; }
#progressBar { flex: 1; max-width: 260px; height: 8px; background: #444; border-radius: 4px; overflow: hidden; }
#progressFill { height: 100%; background: #52c41a; width: 0%; transition: width .3s; }
.hdr-btn { background: #3370ff; border: none; color: #fff; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 13px; }
.hdr-btn.ghost { background: transparent; border: 1px solid #666; }
main { flex: 1; display: flex; overflow: hidden; }
#docPane { flex: 1.2; display: flex; flex-direction: column; background: #fff; margin: 12px 0 12px 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
#sidePane { width: 420px; display: flex; flex-direction: column; background: #fff; margin: 12px; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; }
#docPane .pane-title, #sidePane .pane-title { padding: 10px 14px; font-size: 13px; font-weight: 600; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
#editor { flex: 1; overflow-y: auto; padding: 20px 28px; outline: none; white-space: pre-wrap; line-height: 1.9; font-size: 15px; }
#editor mark.anchor-ok { background: #fff1b8; border-bottom: 2px solid #f0a020; border-radius: 2px; }
#editor mark.anchor-shifted { background: #ffe7ba; border-bottom: 2px dashed #d46b08; border-radius: 2px; }
#editor mark.anchor-orphan { background: #ffd6d6; border-bottom: 2px solid #f5222d; border-radius: 2px; }
#editor mark.flash { outline: 2px solid #3370ff; }
#filters { display: flex; gap: 6px; padding: 8px 12px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
.filter-btn { border: 1px solid #d9d9d9; background: #fff; border-radius: 12px; padding: 3px 10px; font-size: 12px; cursor: pointer; }
.filter-btn.active { background: #3370ff; color: #fff; border-color: #3370ff; }
#commentList { flex: 1; overflow-y: auto; padding: 10px 12px; }
.card { border: 1px solid #e5e6eb; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; font-size: 13px; }
.card.orphan { border-color: #f5222d; background: #fff7f6; }
.card-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
.badge { font-size: 11px; padding: 1px 8px; border-radius: 10px; white-space: nowrap; }
.b-open { background: #e8f3ff; color: #3370ff; }
.b-accepted { background: #e8f7ee; color: #149019; }
.b-rejected { background: #fdeceb; color: #d4380d; }
.b-deferred { background: #f4f4f5; color: #646a73; }
.b-orphan { background: #f5222d; color: #fff; }
.b-shifted { background: #fff3e0; color: #d46b08; }
.quote { border-left: 3px solid #3370ff; background: #f7f8fa; padding: 6px 8px; margin: 6px 0; color: #444; border-radius: 0 4px 4px 0; word-break: break-all; }
.orphan-reason { color: #d4380d; font-size: 12px; margin: 4px 0; }
.meta { color: #8f959e; font-size: 12px; }
.thread { margin: 6px 0 0 8px; border-left: 2px solid #eee; padding-left: 8px; }
.reply { margin: 4px 0; }
.actions { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
.actions button { font-size: 12px; padding: 3px 10px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; }
.actions button:hover { border-color: #3370ff; color: #3370ff; }
.inline-form { margin-top: 8px; display: none; }
.inline-form textarea { width: 100%; min-height: 48px; border: 1px solid #d9d9d9; border-radius: 4px; padding: 6px; font-size: 13px; font-family: inherit; resize: vertical; }
.inline-form .row { margin-top: 6px; display: flex; gap: 6px; justify-content: flex-end; }
.inline-form button { font-size: 12px; padding: 4px 12px; border-radius: 4px; border: 1px solid #d9d9d9; background: #fff; cursor: pointer; }
.inline-form button.ok { background: #3370ff; color: #fff; border-color: #3370ff; }
#newCommentBar { position: fixed; z-index: 50; display: none; background: #1f2329; color: #fff; padding: 8px 12px; border-radius: 6px; font-size: 13px; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
#newCommentBar button { margin-left: 10px; background: #3370ff; color: #fff; border: none; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
#rebindTip { display: none; background: #fff7e6; border: 1px solid #ffd591; color: #ad4e00; padding: 8px 14px; font-size: 13px; }
.empty { color: #8f959e; text-align: center; padding: 30px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>文档评审工作台</h1>
  <div id="summary">
    <span id="summaryText"></span>
    <div id="progressBar"><div id="progressFill"></div></div>
  </div>
  <button class="hdr-btn ghost" id="exportBtn">导出数据</button>
  <button class="hdr-btn ghost" id="importBtn">导入数据</button>
  <input type="file" id="importFile" accept=".json" style="display:none">
</header>
<div id="rebindTip"></div>
<main>
  <section id="docPane">
    <div class="pane-title"><span>文档正文（可直接编辑，意见会自动重新定位）</span><span class="meta" id="saveState"></span></div>
    <div id="editor" contenteditable="true" spellcheck="false"></div>
  </section>
  <section id="sidePane">
    <div class="pane-title"><span>评审意见</span><span class="meta" id="countInfo"></span></div>
    <div id="filters"></div>
    <div id="commentList"></div>
  </section>
</main>
<div id="newCommentBar">已选中一段文字<button id="createCommentBtn">新建意见</button></div>
<script>
"use strict";
const LS_KEY = "docReviewWorkbench.v1";
const SAMPLE_DOC = [
"产品需求文档：智能日程助手 V2.0",
"",
"一、背景",
"随着远程办公的普及，团队成员的日程协调成本显著上升。现有的日历工具缺少跨时区智能推荐能力，导致会议安排效率低下。",
"",
"二、目标",
"1. 将会议安排的平均耗时从 15 分钟降低到 3 分钟以内。",
"2. 支持跨时区的自动时间推荐，覆盖至少 95% 的常见场景。",
"3. 与企业微信、钉钉等主流 IM 工具完成集成。",
"",
"三、功能范围",
"本期包含：智能时间推荐、日程冲突检测、会议纪要自动生成。",
"本期不包含：语音助手、线下会议室预订。",
"",
"四、验收标准",
"所有核心流程需通过自动化测试覆盖，推荐准确率不低于 90%，系统可用性达到 99.9%。"
].join("\n");

let state = { docText: SAMPLE_DOC, comments: [], seq: 1 };
let activeFilter = "all";
let rebindTargetId = null;   // 处于重新绑定模式的意见 id
let pendingSelection = null; // 当前文档选区 {start,end}
let renderTimer = null;

const editor = document.getElementById("editor");
const commentList = document.getElementById("commentList");
const newCommentBar = document.getElementById("newCommentBar");
const rebindTip = document.getElementById("rebindTip");

const STATUS_LABEL = { open: "待处理", accepted: "已采纳", rejected: "已驳回", deferred: "待定" };
const STATUS_CLASS = { open: "b-open", accepted: "b-accepted", rejected: "b-rejected", deferred: "b-deferred" };

function uid() { return "c" + (state.seq++) + "_" + Date.now().toString(36); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function now() { return new Date().toLocaleString("zh-CN", { hour12: false }); }

function save() {
  localStorage.setItem(LS_KEY, JSON.stringify(state));
  document.getElementById("saveState").textContent = "已自动保存 " + now();
}
function load() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (s && typeof s.docText === "string" && Array.isArray(s.comments)) {
        if (typeof s.seq !== "number") s.seq = s.comments.length + 1;
        state = s;
      }
    }
  } catch (e) { console.warn("读取本地数据失败，使用默认内容", e); }
}
// ---------- 锚点定位 ----------
const CTX_LEN = 32;        // 记录的上下文长度
const FUZZY_MIN = 0.55;    // 模糊匹配最低相似度

function buildAnchor(doc, start, end) {
  return {
    exact: doc.slice(start, end),
    prefix: doc.slice(Math.max(0, start - CTX_LEN), start),
    suffix: doc.slice(end, end + CTX_LEN)
  };
}

// 两段文本的相似度（基于字符二元组的 Dice 系数）
function similarity(a, b) {
  if (!a.length && !b.length) return 1;
  if (!a.length || !b.length) return 0;
  const grams = new Map();
  for (let i = 0; i < a.length - 1; i++) {
    const g = a.slice(i, i + 2);
    grams.set(g, (grams.get(g) || 0) + 1);
  }
  let hit = 0;
  for (let i = 0; i < b.length - 1; i++) {
    const g = b.slice(i, i + 2);
    if (grams.get(g) > 0) { hit++; grams.set(g, grams.get(g) - 1); }
  }
  return (2 * hit) / (Math.max(1, a.length - 1) + Math.max(1, b.length - 1));
}

function contextScore(doc, pos, anchor) {
  const pre = doc.slice(Math.max(0, pos - anchor.prefix.length), pos);
  const suf = doc.slice(pos + anchor.exact.length, pos + anchor.exact.length + anchor.suffix.length);
  let score = 0, weight = 0;
  if (anchor.prefix) { score += similarity(anchor.prefix, pre) * anchor.prefix.length; weight += anchor.prefix.length; }
  if (anchor.suffix) { score += similarity(anchor.suffix, suf) * anchor.suffix.length; weight += anchor.suffix.length; }
  return weight ? score / weight : 0.5;
}

// 在文档中为一条锚点寻找当前位置
function resolveAnchor(doc, anchor, prev) {
  if (!anchor.exact) return { status: "orphan", reason: "锚点内容为空，无法定位。" };
  // 1. 精确匹配：收集所有出现位置，用上下文相似度选最优
  const hits = [];
  let idx = doc.indexOf(anchor.exact);
  while (idx !== -1) { hits.push(idx); idx = doc.indexOf(anchor.exact, idx + 1); }
  if (hits.length) {
    let best = hits[0], bestScore = -1;
    for (const h of hits) {
      const s = contextScore(doc, h, anchor);
      if (s > bestScore) { bestScore = s; best = h; }
    }
    return { status: "ok", start: best, end: best + anchor.exact.length };
  }
  // 2. 模糊匹配：滑动窗口找最相似片段（大文档时限制在旧位置附近搜索）
  const len = anchor.exact.length;
  const minLen = Math.max(2, Math.floor(len * 0.6));
  const maxLen = Math.ceil(len * 1.4);
  let rangeStart = 0, rangeEnd = doc.length;
  if (doc.length > 8000 && prev && prev.start != null) {
    rangeStart = Math.max(0, prev.start - 2000);
    rangeEnd = Math.min(doc.length, prev.end + 2000);
  } else if (doc.length > 8000) {
    return { status: "orphan", reason: "文档较大且原文已删除，无法自动定位，请手动重新绑定。" };
  }
  let best = null, bestSim = 0;
  for (let w = minLen; w <= maxLen; w++) {
    for (let i = rangeStart; i + w <= rangeEnd; i++) {
      // 用长度比修正得分，避免短窗口因局部重合而胜出
      const sim = similarity(anchor.exact, doc.slice(i, i + w)) * (Math.min(w, len) / Math.max(w, len));
      if (sim > bestSim) { bestSim = sim; best = { start: i, end: i + w }; }
    }
  }
  if (best && bestSim >= FUZZY_MIN) {
    return { status: "shifted", start: best.start, end: best.end,
      reason: "原文已被改写（相似度 " + Math.round(bestSim * 100) + "%），已自动定位到最相近的片段，请人工确认。" };
  }
  // 3. 失配
  const ctxHit = (anchor.prefix && doc.includes(anchor.prefix)) || (anchor.suffix && doc.includes(anchor.suffix));
  const reason = ctxHit
    ? "原文已被删除或大幅改写（上下文仍在，但引用的文字已找不到），请重新绑定。"
    : "原文及其上下文均已不存在，可能整段内容已被删除，请重新绑定。";
  return { status: "orphan", reason };
}

// 文档变化后统一重定位所有意见，保证同一文本上的多条意见一致更新
function reanchorAll() {
  for (const c of state.comments) {
    const r = resolveAnchor(state.docText, c.anchor, c.location);
    c.location = r.status === "orphan" ? null : { start: r.start, end: r.end };
    c.anchorStatus = r.status;
    c.anchorReason = r.reason || "";
  }
}
// ---------- 编辑器渲染（含高亮与光标保持） ----------
function getCaretOffset() {
  const sel = window.getSelection();
  if (!sel.rangeCount || !editor.contains(sel.anchorNode)) return null;
  const range = sel.getRangeAt(0).cloneRange();
  range.selectNodeContents(editor);
  range.setEnd(sel.getRangeAt(0).startContainer, sel.getRangeAt(0).startOffset);
  return range.toString().length;
}

function setCaretOffset(offset) {
  if (offset == null) return;
  const walker = document.createTreeWalker(editor, NodeFilter.SHOW_TEXT);
  let node, acc = 0;
  while ((node = walker.nextNode())) {
    if (acc + node.data.length >= offset) {
      const sel = window.getSelection();
      const range = document.createRange();
      range.setStart(node, offset - acc);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
      return;
    }
    acc += node.data.length;
  }
}

function renderEditor() {
  const caret = getCaretOffset();
  const text = state.docText;
  // 收集所有已定位意见的区间，统一排序后一次性渲染，保证同段文字上的多条意见一致更新
  const marks = state.comments
    .filter(c => c.location)
    .map(c => ({ start: c.location.start, end: c.location.end, status: c.anchorStatus, id: c.id }))
    .sort((a, b) => a.start - b.start || b.end - a.end);
  let html = "", pos = 0;
  for (const m of marks) {
    if (m.start < pos) continue; // 重叠区间只画最外层，列表中状态仍一致
    html += esc(text.slice(pos, m.start));
    html += '<mark class="anchor-' + m.status + '" data-cid="' + m.id + '">' + esc(text.slice(m.start, m.end)) + "</mark>";
    pos = m.end;
  }
  html += esc(text.slice(pos));
  editor.innerHTML = html;
  setCaretOffset(caret);
}

// 选区 -> 文档纯文本偏移
function selectionOffsets() {
  const sel = window.getSelection();
  if (!sel.rangeCount || sel.isCollapsed) return null;
  const range = sel.getRangeAt(0);
  if (!editor.contains(range.commonAncestorContainer)) return null;
  const pre = range.cloneRange();
  pre.selectNodeContents(editor);
  pre.setEnd(range.startContainer, range.startOffset);
  const start = pre.toString().length;
  const len = range.toString().length;
  if (!len) return null;
  return { start, end: start + len };
}

editor.addEventListener("input", () => {
  state.docText = editor.innerText.replace(/\r/g, "");
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    reanchorAll();   // 一次性重定位全部意见（含同一文本上的多条）
    renderEditor();
    renderComments();
    renderSummary();
    save();
  }, 500);
});
// ---------- 右侧意见列表与汇总 ----------
const FILTERS = [
  ["all", "全部"], ["open", "待处理"], ["orphan", "失配"],
  ["accepted", "已采纳"], ["rejected", "已驳回"], ["deferred", "待定"]
];

function renderFilters() {
  const box = document.getElementById("filters");
  box.innerHTML = "";
  for (const [key, label] of FILTERS) {
    const n = state.comments.filter(c =>
      key === "all" ? true : key === "orphan" ? c.anchorStatus === "orphan" : c.status === key).length;
    const btn = document.createElement("button");
    btn.className = "filter-btn" + (activeFilter === key ? " active" : "");
    btn.textContent = label + " (" + n + ")";
    btn.onclick = () => { activeFilter = key; renderFilters(); renderComments(); };
    box.appendChild(btn);
  }
}

function renderSummary() {
  const total = state.comments.length;
  const done = state.comments.filter(c => c.status === "accepted" || c.status === "rejected").length;
  const orphan = state.comments.filter(c => c.anchorStatus === "orphan").length;
  const open = state.comments.filter(c => c.status === "open").length;
  document.getElementById("summaryText").textContent =
    "共 " + total + " 条 · 待处理 " + open + " · 失配 " + orphan + " · 已闭环 " + done + "/" + total;
  document.getElementById("progressFill").style.width = total ? Math.round(done / total * 100) + "%" : "0%";
  document.getElementById("countInfo").textContent = total + " 条意见";
}

function matchFilter(c) {
  if (activeFilter === "all") return true;
  if (activeFilter === "orphan") return c.anchorStatus === "orphan";
  return c.status === activeFilter;
}

function renderComments() {
  renderFilters();
  const list = state.comments.filter(matchFilter);
  commentList.innerHTML = "";
  if (!list.length) {
    commentList.innerHTML = '<div class="empty">当前筛选条件下没有意见</div>';
    return;
  }
  for (const c of list) commentList.appendChild(buildCard(c));
}

function badgeHtml(c) {
  let h = '<span class="badge ' + STATUS_CLASS[c.status] + '">' + STATUS_LABEL[c.status] + "</span>";
  if (c.anchorStatus === "orphan") h += '<span class="badge b-orphan">定位失配</span>';
  else if (c.anchorStatus === "shifted") h += '<span class="badge b-shifted">位置待确认</span>';
  return h;
}

function buildCard(c) {
  const card = document.createElement("div");
  card.className = "card" + (c.anchorStatus === "orphan" ? " orphan" : "");
  card.dataset.cid = c.id;
  let html = '<div class="card-head">' + badgeHtml(c) +
    '<span class="meta">' + esc(c.author) + " · " + esc(c.createdAt) + "</span></div>";
  html += '<div class="quote">“' + esc(c.anchor.exact) + "”</div>";
  if (c.anchorStatus !== "ok" && c.anchorReason)
    html += '<div class="orphan-reason">' + esc(c.anchorReason) + "</div>";
  html += "<div>" + esc(c.content) + "</div>";
  if (c.status === "rejected" && c.rejectReason)
    html += '<div class="orphan-reason">驳回理由：' + esc(c.rejectReason) + "</div>";
  if (c.replies.length) {
    html += '<div class="thread">';
    for (const r of c.replies)
      html += '<div class="reply"><span class="meta">' + esc(r.author) + " · " + esc(r.time) + "：</span>" + esc(r.text) + "</div>";
    html += "</div>";
  }
  card.innerHTML = html;
  card.appendChild(buildActions(c));
  card.appendChild(buildInlineForm(c));
  return card;
}
function buildActions(c) {
  const box = document.createElement("div");
  box.className = "actions";
  const add = (label, fn) => {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = fn;
    box.appendChild(b);
  };
  if (c.status !== "accepted") add("采纳", () => setStatus(c, "accepted"));
  if (c.status !== "rejected") add("驳回", () => showForm(c, "reject"));
  if (c.status !== "deferred") add("待定", () => setStatus(c, "deferred"));
  if (c.status !== "open") add("重新打开", () => setStatus(c, "open"));
  add("回复", () => showForm(c, "reply"));
  if (c.location) add("定位", () => scrollToAnchor(c));
  if (c.anchorStatus === "orphan") add("重新绑定", () => startRebind(c));
  return box;
}

function setStatus(c, status, reason) {
  c.status = status;
  if (status === "rejected") c.rejectReason = reason;
  c.history = c.history || [];
  c.history.push({ status, time: now(), reason: reason || "" });
  renderComments(); renderSummary(); save();
}

let openForm = null; // {cid, mode}
function showForm(c, mode) { openForm = { cid: c.id, mode }; renderComments(); }

function buildInlineForm(c) {
  const form = document.createElement("div");
  form.className = "inline-form";
  if (!openForm || openForm.cid !== c.id) return form;
  form.style.display = "block";
  const isReject = openForm.mode === "reject";
  const ta = document.createElement("textarea");
  ta.placeholder = isReject ? "请填写驳回理由（必填）" : "输入回复内容…";
  const row = document.createElement("div");
  row.className = "row";
  const cancel = document.createElement("button");
  cancel.textContent = "取消";
  cancel.onclick = () => { openForm = null; renderComments(); };
  const ok = document.createElement("button");
  ok.className = "ok";
  ok.textContent = isReject ? "确认驳回" : "发送回复";
  ok.onclick = () => {
    const text = ta.value.trim();
    if (isReject) {
      if (!text) { ta.placeholder = "驳回必须填写理由！"; ta.focus(); return; }
      openForm = null;
      setStatus(c, "rejected", text);
    } else {
      if (!text) return;
      if (!c.content) c.content = text; // 首条内容作为意见正文
      else c.replies.push({ author: "我", text, time: now() });
      openForm = null;
      renderComments(); save();
    }
  };
  row.appendChild(cancel); row.appendChild(ok);
  form.appendChild(ta); form.appendChild(row);
  setTimeout(() => ta.focus(), 0);
  return form;
}

function scrollToAnchor(c) {
  renderEditor();
  const mark = editor.querySelector('mark[data-cid="' + c.id + '"]');
  if (mark) {
    mark.scrollIntoView({ behavior: "smooth", block: "center" });
    mark.classList.add("flash");
    setTimeout(() => mark.classList.remove("flash"), 1600);
  }
}
// ---------- 选区、新建意见与重新绑定 ----------
document.addEventListener("selectionchange", () => {
  const off = selectionOffsets();
  pendingSelection = off;
  if (!off) { newCommentBar.style.display = "none"; return; }
  if (rebindTargetId) {
    rebindTip.textContent = "重新绑定：已选中 “" + state.docText.slice(off.start, off.end).slice(0, 30) +
      "…” ，点击右侧意见卡片的「确认绑定」完成，或按 Esc 取消。";
    renderComments();
  } else {
    newCommentBar.style.display = "block";
    newCommentBar.style.left = "40%";
    newCommentBar.style.bottom = "24px";
    newCommentBar.style.top = "auto";
  }
});

document.addEventListener("keydown", e => {
  if (e.key === "Escape" && rebindTargetId) cancelRebind();
});

document.getElementById("createCommentBtn").onclick = () => {
  if (!pendingSelection) return;
  const { start, end } = pendingSelection;
  const c = {
    id: uid(), author: "评审人", createdAt: now(),
    anchor: buildAnchor(state.docText, start, end),
    content: "", status: "open", rejectReason: "",
    replies: [], history: []
  };
  const r = resolveAnchor(state.docText, c.anchor);
  c.location = { start: r.start, end: r.end };
  c.anchorStatus = "ok"; c.anchorReason = "";
  state.comments.unshift(c);
  newCommentBar.style.display = "none";
  window.getSelection().removeAllRanges();
  openForm = { cid: c.id, mode: "reply" }; // 立即填写意见内容
  reanchorAll(); renderEditor(); renderComments(); renderSummary(); save();
};

function startRebind(c) {
  rebindTargetId = c.id;
  rebindTip.style.display = "block";
  rebindTip.textContent = "重新绑定模式：请在左侧文档中选中该意见对应的新位置文字（Esc 取消）。";
  renderComments();
}
function cancelRebind() {
  rebindTargetId = null;
  rebindTip.style.display = "none";
  renderComments();
}
function confirmRebind(c) {
  if (!pendingSelection) { alert("请先在左侧文档中选中一段文字。"); return; }
  c.anchor = buildAnchor(state.docText, pendingSelection.start, pendingSelection.end);
  const r = resolveAnchor(state.docText, c.anchor);
  c.location = { start: r.start, end: r.end };
  c.anchorStatus = "ok"; c.anchorReason = "";
  c.replies.push({ author: "我", text: "（已手动重新绑定到新位置）", time: now() });
  cancelRebind();
  reanchorAll(); renderEditor(); renderComments(); renderSummary(); save();
}

// 重新绑定模式下，失配卡片追加「确认绑定」按钮
const origBuildActions = buildActions;
buildActions = function (c) {
  const box = origBuildActions(c);
  if (rebindTargetId === c.id) {
    const b = document.createElement("button");
    b.textContent = "确认绑定";
    b.className = "primary";
    b.onclick = () => confirmRebind(c);
    box.appendChild(b);
  }
  return box;
};

// ---------- 导入 / 导出 ----------
document.getElementById("exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "评审数据_" + new Date().toISOString().slice(0, 10) + ".json";
  a.click();
  URL.revokeObjectURL(a.href);
};
document.getElementById("importBtn").onclick = () => document.getElementById("importFile").click();
document.getElementById("importFile").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const s = JSON.parse(reader.result);
      if (!s || typeof s.docText !== "string" || !Array.isArray(s.comments)) throw new Error("bad");
      if (typeof s.seq !== "number") s.seq = s.comments.length + 1;
      state = s;
      reanchorAll(); renderEditor(); renderComments(); renderSummary(); save();
    } catch (err) { alert("导入失败：文件格式不正确。"); }
  };
  reader.readAsText(f);
};

// ---------- 初始化 ----------
load();
reanchorAll();
renderEditor();
renderComments();
renderSummary();
</script>
</body>
</html>
