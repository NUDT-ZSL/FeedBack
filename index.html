<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地理围栏推演工具</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>地理围栏推演工具</h1>
  <div class="toolbar">
    <button id="btn-draw" title="在地图上连续点击绘制多边形，双击或回车结束">绘制围栏</button>
    <button id="btn-edit" class="active" title="拖拽顶点编辑，点击边中点插入顶点，右键顶点删除">编辑/选择</button>
    <button id="btn-pan" title="拖拽平移，滚轮缩放">平移</button>
    <span class="sep"></span>
    <button id="btn-sample">加载示例场景</button>
    <button id="btn-run" class="primary">重新推演</button>
    <label class="autorun"><input type="checkbox" id="chk-autorun" checked> 修改后自动推演</label>
  </div>
</header>
<main>
  <section id="map-wrap">
    <canvas id="map"></canvas>
    <div id="map-hint">编辑模式：点击围栏选中；拖拽顶点调整；滚轮缩放</div>
  </section>
  <aside id="side">
    <div class="panel">
      <h2>围栏列表</h2>
      <div id="fence-list"></div>
    </div>
    <div class="panel" id="fence-editor">
      <h2>围栏配置</h2>
      <div id="fence-form"><p class="muted">在地图上绘制或选中一个围栏</p></div>
    </div>
    <div class="panel">
      <h2>导入轨迹</h2>
      <p class="muted">CSV 列：time,x,y[,speed] 或 time,lat,lon[,speed]；也支持 JSON 数组。speed 单位 km/h，可省略（由点位推算）。</p>
      <textarea id="import-text" rows="5" placeholder="2026-09-22T10:00:00,100,120,30"></textarea>
      <div class="row">
        <input type="file" id="import-file" accept=".csv,.json,.txt">
        <button id="btn-import">导入</button>
        <button id="btn-clear-track">清空轨迹</button>
      </div>
    </div>
    <div class="panel" id="warnings-panel" style="display:none">
      <h2>数据提示</h2>
      <ul id="warnings"></ul>
    </div>
  </aside>
</main>
<footer>
  <div class="panel">
    <h2>事件时间轴 <span id="event-count" class="muted"></span></h2>
    <div id="timeline"></div>
    <div id="event-detail" class="muted">点击事件查看触发位置与判定依据</div>
  </div>
  <div class="panel" id="suppressed-panel" style="display:none">
    <h2>被压制的候选事件</h2>
    <div id="suppressed"></div>
  </div>
</footer>
<script src="js/geo.js"></script>
<script src="js/engine.js"></script>
<script src="js/mapview.js"></script>
<script src="js/app.js"></script>
</body>
</html>
