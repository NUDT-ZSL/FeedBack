<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>三维部件标注工具</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; background: #14181f; color: #d5dbe5; overflow: hidden; }
  #view { position: absolute; inset: 0 300px 0 0; }
  #scene { width: 100%; height: 100%; display: block; cursor: grab; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ann-label {
    position: absolute; transform: translate(-50%, -100%); pointer-events: auto;
    background: #1f2937; border: 1px solid #4b5563; border-radius: 4px;
    padding: 3px 8px; white-space: nowrap; cursor: move; user-select: none;
    box-shadow: 0 2px 6px rgba(0,0,0,.4); font-size: 12px;
  }
  .ann-label.selected { border-color: #60a5fa; background: #1e3a5f; }
  .ann-label.invalid { border: 1px dashed #ef4444; color: #fca5a5; background: #3f1d1d; }
  #sidebar { position: absolute; top: 0; right: 0; bottom: 0; width: 300px; background: #1b212b;
    border-left: 1px solid #2c3542; padding: 10px; overflow-y: auto; }
  #sidebar h2 { font-size: 13px; margin: 12px 0 6px; color: #9fb2cc; text-transform: uppercase; letter-spacing: .05em; }
  #sidebar h2:first-child { margin-top: 0; }
  button { background: #2b3648; color: #d5dbe5; border: 1px solid #3d4a61; border-radius: 4px;
    padding: 4px 10px; cursor: pointer; font-size: 12px; margin: 2px 2px 2px 0; }
  button:hover { background: #36435a; }
  button.active { background: #1d4ed8; border-color: #3b82f6; }
  button.danger { border-color: #7f1d1d; background: #4c1d1d; }
  .row { display: flex; align-items: center; gap: 4px; margin: 2px 0; }
  .row label { width: 52px; color: #8fa0b8; flex: none; }
  .row input { width: 0; flex: 1; background: #11161d; border: 1px solid #33405a; color: #d5dbe5;
    border-radius: 3px; padding: 2px 5px; font-size: 12px; }
  .list-item { padding: 4px 6px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; }
  .list-item:hover { background: #242d3a; }
  .list-item.selected { background: #1e3a5f; }
  .list-item .bad { color: #f87171; }
  .hint { color: #6b7a90; font-size: 11px; margin: 6px 0; }
  #toast { position: absolute; left: 12px; bottom: 12px; background: #7f1d1d; color: #fecaca;
    padding: 6px 12px; border-radius: 4px; display: none; }
</style>
</head>
<body>
  <div id="view">
    <canvas id="scene"></canvas>
    <div id="labels"></div>
    <div id="toast"></div>
  </div>
  <div id="sidebar">
    <h2>场景</h2>
    <div>
      <button id="btnAddPart">新建部件</button>
      <button id="btnAnnotate">标注模式</button>
    </div>
    <div>
      <button id="btnExport">导出场景</button>
      <button id="btnImport">导入场景</button>
      <input type="file" id="fileInput" accept=".json" style="display:none">
    </div>
    <div class="hint">左键拖拽旋转 / 右键或Shift拖拽平移 / 滚轮缩放。标注模式下点击部件表面放置标注。</div>
    <h2>部件</h2>
    <div id="partList"></div>
    <div id="partEditor"></div>
    <h2>标注</h2>
    <div id="annList"></div>
    <div id="annEditor"></div>
  </div>
  <script src="math3d.js"></script>
  <script src="scene.js"></script>
  <script src="render.js"></script>
  <script src="panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
