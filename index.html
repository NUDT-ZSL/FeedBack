<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>离线协作白板 · 确定性同步演示</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>离线协作白板</h1>
      <p>本地操作立即生效；确认按服务顺序提交，冲突分支可回退和重试。</p>
    </div>
    <div class="sync-card">
      <span id="syncDot" class="sync-dot"></span>
      <div>
        <strong id="syncState">同步中</strong>
        <small id="syncMeta">修订 #0</small>
      </div>
    </div>
  </header>

  <main class="layout">
    <section class="workspace">
      <div class="toolbar" aria-label="白板工具栏">
        <button type="button" data-action="add-note">＋ 添加便签</button>
        <button type="button" data-action="add-rect">▭ 添加方形</button>
        <button type="button" data-action="add-circle">● 添加圆形</button>
        <span class="divider"></span>
        <span class="color-label">颜色</span>
        <button type="button" class="color-swatch" data-color="#fde68a" style="background:#fde68a" aria-label="黄色"></button>
        <button type="button" class="color-swatch" data-color="#bae6fd" style="background:#bae6fd" aria-label="蓝色"></button>
        <button type="button" class="color-swatch" data-color="#bbf7d0" style="background:#bbf7d0" aria-label="绿色"></button>
        <button type="button" class="color-swatch" data-color="#fecdd3" style="background:#fecdd3" aria-label="粉色"></button>
        <button type="button" class="color-swatch" data-color="#ddd6fe" style="background:#ddd6fe" aria-label="紫色"></button>
        <span class="spacer"></span>
        <button type="button" id="deleteSelected" class="danger" disabled>删除选中元素</button>
      </div>
      <div id="canvas" class="canvas" tabindex="0" aria-label="可编辑白板画布"></div>
    </section>

    <aside class="sidebar">
      <section class="panel server-panel">
        <h2>本地服务模拟器</h2>
        <p class="hint">服务按操作发送顺序生成修订；回调可乱序到达。</p>
        <label class="range-row">
          最大确认延迟
          <input id="latency" type="range" min="0" max="3000" step="100" value="1200">
          <output id="latencyValue">1.2s</output>
        </label>
        <div class="server-actions">
          <button type="button" id="armReject">下一次拒绝</button>
          <button type="button" id="armDiverge">下一次结果不同</button>
        </div>
        <div id="serverMode" class="server-mode">正常确认</div>
      </section>

      <section class="panel rollback-panel">
        <div class="panel-title">
          <h2>回退与保留</h2>
          <span id="rollbackCount" class="count-badge">0</span>
        </div>
        <div id="rollbackList" class="rollback-list"></div>
      </section>

      <section class="panel log-panel">
        <div class="panel-title">
          <h2>操作日志</h2>
          <span id="logCounts" class="muted"></span>
        </div>
        <div id="operationLog" class="operation-log"></div>
      </section>
    </aside>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/core.js"></script>
  <script src="js/server.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
