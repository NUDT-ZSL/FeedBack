<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>学习路径推演台</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>学习路径推演台</h1>
  <span id="graph-health"></span>
</header>
<main>
  <aside id="left">
    <section class="card">
      <h2>学习者</h2>
      <ul id="learner-list"></ul>
    </section>
    <section class="card">
      <h2>学习节奏参数</h2>
      <label>每日可投入（分钟）
        <input id="param-daily" type="number" value="60" min="10" step="10">
      </label>
      <label>单知识点最短停留（天）
        <input id="param-dwell" type="number" value="1" min="1">
      </label>
      <button id="apply-params">应用并重排</button>
    </section>
    <section class="card">
      <h2>推演日志</h2>
      <ul id="log"></ul>
    </section>
  </aside>
  <section id="center" class="card">
    <h2>知识点图谱 <small>（点击节点可调整掌握判定）</small></h2>
    <div id="graph-wrap"><svg id="graph"></svg></div>
    <div id="node-menu" class="hidden"></div>
  </section>
  <aside id="right">
    <section class="card">
      <h2>矛盾裁决</h2>
      <div id="conflicts"></div>
    </section>
    <section class="card">
      <h2>学习路径与排期</h2>
      <ol id="path"></ol>
    </section>
  </aside>
</main>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="derive.js"></script>
<script src="schedule.js"></script>
<script src="app.js"></script>
<script src="ui.js"></script>
<script src="panels.js"></script>
</body>
</html>
