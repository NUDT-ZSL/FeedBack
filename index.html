<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>财务方案假设敏感性评审工具</title>
<style>
  :root {
    --bg: #0f141b; --panel: #171e28; --panel2: #1d2634; --line: #2a3648;
    --txt: #dbe4ee; --dim: #8494a7; --accent: #4da3ff; --ok: #3ecf8e;
    --warn: #f5b942; --bad: #f0616d; --conflict: #e08cff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 14px/1.55 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 14px 22px; border-bottom: 1px solid var(--line); background: var(--panel);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--dim); font-size: 12px; }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  button {
    background: var(--panel2); color: var(--txt); border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 12px; cursor: pointer; font-size: 13px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  main {
    display: grid; gap: 14px; padding: 16px 22px;
    grid-template-columns: minmax(320px, 1fr) minmax(340px, 1.2fr) minmax(320px, 1fr);
  }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 14px 16px; min-width: 0;
  }
  .panel h2 { font-size: 14px; margin: 0 0 10px; color: var(--accent); font-weight: 600; }
  .panel h3 { font-size: 13px; margin: 12px 0 6px; color: var(--dim); font-weight: 600; }
  .span2 { grid-column: span 2; }
  .hidden { display: none; }
  .dim { color: var(--dim); }
  code { background: var(--panel2); border-radius: 4px; padding: 1px 6px; font-size: 12px; color: var(--accent); }
  .src { font-size: 11px; color: var(--dim); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
  .unit { color: var(--dim); font-size: 12px; }
  .badge { font-size: 11px; border-radius: 4px; padding: 1px 8px; }
  .badge-ok { background: rgba(62,207,142,.15); color: var(--ok); }
  .badge-warn { background: rgba(245,185,66,.15); color: var(--warn); }
  .badge-bad { background: rgba(240,97,109,.18); color: var(--bad); }
  .badge-conflict { background: rgba(224,140,255,.15); color: var(--conflict); }

  /* 假设 */
  .arow { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; background: var(--panel2); }
  .arow.conflicted { border-color: var(--conflict); opacity: .85; }
  .ahead { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .abody { display: flex; align-items: center; gap: 10px; }
  .abody input[type=range] { flex: 1; accent-color: var(--accent); }
  .abody input[type=number] { width: 84px; }
  .ameta { color: var(--dim); font-size: 12px; margin-top: 4px; }
  input[type=number], input[type=text] {
    background: var(--bg); color: var(--txt); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 8px; font-size: 13px; width: 100%;
  }
  input:focus { outline: none; border-color: var(--accent); }

  /* 指标 */
  .mcard { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; background: var(--panel2); }
  .mhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .mhead .thr { margin-left: auto; color: var(--warn); font-size: 12px; }
  .mvals { display: flex; gap: 18px; margin: 6px 0; font-size: 13px; }
  .mvals b { font-size: 16px; }
  .mbar-track { position: relative; height: 14px; background: var(--bg); border-radius: 7px; border: 1px solid var(--line); }
  .mbar-track span { position: absolute; top: -3px; transform: translateX(-50%); }
  .mbar-base { width: 0; height: 0; border-left: 6px solid transparent; border-right: 6px solid transparent; border-bottom: 8px solid var(--dim); top: -8px !important; }
  .mbar-thr { width: 2px; height: 18px; background: var(--warn); }
  .mbar-cur { width: 12px; height: 12px; border-radius: 50%; background: var(--ok); top: 0 !important; }
  .mbar-cur.bad { background: var(--bad); }
  .mbar-legend { display: flex; gap: 14px; color: var(--dim); font-size: 11px; margin-top: 3px; }
  .mcontrib { margin-top: 8px; }
  .crow { display: flex; align-items: center; gap: 8px; margin: 2px 0; font-size: 12px; }
  .cname { width: 90px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); }
  .cbar { flex: 1; height: 10px; background: var(--bg); border-radius: 5px; overflow: hidden; }
  .cbar-fill { display: block; height: 100%; }
  .cbar-fill.pos { background: var(--ok); }
  .cbar-fill.neg { background: var(--bad); }
  .cval { width: 70px; text-align: right; font-variant-numeric: tabular-nums; }
  .csum { margin-top: 6px; font-size: 12px; color: var(--ok); border-top: 1px dashed var(--line); padding-top: 5px; }

  /* 方向与扫描 */
  .dir-grid { display: grid; gap: 6px; }
  .dir-row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dir-row span:first-child { width: 90px; }
  .dir-row input { width: 90px; }
  .row-actions { margin-top: 8px; display: flex; gap: 8px; }
  .swcard { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 4px; }
  .sw-line { font-size: 12.5px; margin: 3px 0; }
  .sw-conc { font-size: 12px; border-radius: 6px; padding: 5px 8px; margin-top: 6px; }
  .sw-conc.kept { background: rgba(62,207,142,.1); color: var(--ok); }
  .sw-conc.changed { background: rgba(245,185,66,.1); color: var(--warn); }

  /* 响应编辑器 */
  .resp-head { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  select { background: var(--bg); color: var(--txt); border: 1px solid var(--line); border-radius: 5px; padding: 4px 8px; }
  .prow { display: flex; align-items: center; gap: 10px; margin: 4px 0; }
  .prow .pidx { width: 30px; color: var(--dim); font-size: 12px; }
  .prow label { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--dim); }
  .prow input { width: 90px; }
  .prow button { padding: 2px 8px; }
  #resp-segs { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .seg { font-size: 11px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 1px 7px; color: var(--dim); }
  #resp-note { font-size: 12px; color: var(--dim); margin: 6px 0; }
  .err { color: var(--bad); font-size: 12.5px; margin: 2px 0; }

  /* 冲突 */
  .ccard { border: 1px solid var(--conflict); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; }
  .chead { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; font-weight: 600; }
  .copts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .copt { background: var(--panel2); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  .copt-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .copt-body { font-size: 12.5px; color: var(--txt); word-break: break-all; }

  /* 日志 / 自检 */
  .lrow { font-size: 12.5px; padding: 3px 0; border-bottom: 1px dashed var(--line); }
  .lrow .ltime { color: var(--dim); margin-right: 8px; font-size: 11px; }
  .lrow.reject { color: var(--bad); }
  .lrow.conflict { color: var(--conflict); }
  .lrow.info { color: var(--dim); }
  .trow { font-size: 13px; padding: 4px 0; }
  .trow.ok { color: var(--ok); }
  .trow.fail { color: var(--bad); }
  .trow pre { margin: 4px 0 4px 20px; font-size: 11px; color: var(--bad); white-space: pre-wrap; }

  details { margin-top: 10px; }
  summary { cursor: pointer; color: var(--dim); font-size: 13px; }
  .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
  .form-grid label { font-size: 12px; color: var(--dim); display: flex; flex-direction: column; gap: 3px; }

  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } .span2 { grid-column: span 1; } }
</style>
</head>
<body>
<header>
  <h1>财务方案假设敏感性评审工具</h1>
  <span class="sub">本地离线运行 · 数据均为录入的假设与响应配置 · 不连接真实财务系统</span>
  <div class="actions">
    <button data-action="selftest">运行自检</button>
    <button data-action="reset">重置示例数据</button>
  </div>
</header>

<main>
  <section class="panel" id="p-assump">
    <h2>① 假设项（拖动即改取值）</h2>
    <div id="assump-list"></div>
    <details>
      <summary>＋ 登记新假设</summary>
      <div class="form-grid">
        <label>标识（唯一）<input type="text" id="na-id" placeholder="如 wage_growth"></label>
        <label>名称<input type="text" id="na-name" placeholder="如 薪酬涨幅"></label>
        <label>基准值<input type="number" id="na-base" step="any"></label>
        <label>单位<input type="text" id="na-unit" placeholder="%"></label>
        <label>扰动下限<input type="number" id="na-min" step="any"></label>
        <label>扰动上限<input type="number" id="na-max" step="any"></label>
        <label>来源<input type="text" id="na-source" placeholder="如 财务组"></label>
      </div>
      <div id="na-errors"></div>
      <div class="row-actions"><button data-action="add-assump">登记</button></div>
    </details>
  </section>

  <section class="panel" id="p-metrics">
    <h2>② 指标、决策边界与贡献分解</h2>
    <div id="metric-list"></div>
  </section>

  <section class="panel" id="p-dir">
    <h2>③ 扰动方向与越线扫描</h2>
    <div id="dir-editor"></div>
    <div id="sweep-results"></div>
  </section>

  <section class="panel span2" id="p-resp">
    <h2>④ 响应段编辑（分段线性，断点须恰好覆盖假设区间）</h2>
    <div class="resp-head">
      <label>假设 <select id="resp-aid"></select></label>
      <label>指标 <select id="resp-mid"></select></label>
      <label>来源 <input type="text" id="resp-source" placeholder="界面编辑" style="width:110px"></label>
      <button data-action="resp-addrow">＋断点</button>
      <button data-action="resp-apply">应用</button>
    </div>
    <div id="resp-note"></div>
    <div id="resp-rows"></div>
    <div id="resp-errors"></div>
    <div id="resp-segs"></div>
  </section>

  <section class="panel" id="p-conflict">
    <h2>⑤ 冲突记录</h2>
    <div id="conflict-list"></div>
  </section>

  <section class="panel span2" id="p-log">
    <h2>⑥ 校验与拒绝日志</h2>
    <div id="log-list"></div>
  </section>

  <section class="panel hidden" id="p-test">
    <h2>自检结果</h2>
    <div id="test-results"></div>
  </section>
</main>

<script src="engine.js"></script>
<script src="tests.js"></script>
<script src="app.js"></script>
</body>
</html>
