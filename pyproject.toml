[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "offline-capacity-planner"
version = "0.1.0"
description = "Local-only resource usage trend analysis and capacity forecasting"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
capacity-planner = "capacity_planner.cli:main"

[tool.setuptools.packages.find]
include = ["capacity_planner*"]
