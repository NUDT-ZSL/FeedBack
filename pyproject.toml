[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relay-allocator"
version = "0.1.0"
description = "Priority-aware shared or isolated allocation for edge backhaul links"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary" }
authors = [{ name = "AutoDemo" }]

[tool.setuptools]
packages = ["relay_allocator"]
