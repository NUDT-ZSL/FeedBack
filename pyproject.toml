[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "depimpact"
version = "0.1.0"
description = "Offline dependency impact propagation and structural diagnosis tool"
requires-python = ">=3.8"
readme = "README.md"

[project.scripts]
depimpact = "depimpact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

